# Ameba configuration for crystal-es
# https://github.com/crystal-ameba/ameba
#
# Everything not listed here runs with Ameba's default settings. Rules are only
# relaxed below when they conflict with something this code base cannot change,
# and each exemption carries its reason.
#
# Note: Ameba silently ignores rule names it does not recognise, so a typo here
# disables nothing and reports nothing. Check with `make lint-ameba` after edits.

# Files the linter inspects. Dependencies in `lib` and the compiled linter in
# `bin` are never our code, so they stay out.
Globs:
  - "**/*.cr"
  - "!lib"
  - "!bin"

# The adapters build their migration SQL with `%( ... )` string literals so the
# statements line up with the surrounding Crystal code. Switching them to
# heredocs would churn every migration for no readability gain.
Style/MultilineStringLiteral:
  Enabled: false

# The two rules below stay on for new code and are exempted per file, so only
# the accessors that are already part of the published API keep their names.

# `ES::Aggregate::State#set_type` is called by every aggregate that subclasses
# it, including the ones in examples/; renaming it to `type=` would break them.
Naming/AccessorMethodName:
  Excluded:
    - src/components/aggregate.cr

# `ES::ProjectionMeta::DriftStatus#verified` and `ES::Exception::Error#print_backtrace`
# are public readers. Converting them to `getter?` would remove the current
# accessors from the shard's public surface.
Naming/QueryBoolMethods:
  Excluded:
    - src/components/projection_meta.cr
    - src/exceptions/error.cr
